name: streakly
description: A polished Flutter habit tracker for Android and Windows with Firebase sync, streaks, statistics, reminders, challenges, and leaderboard progress.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.69.0
  flutter_local_notifications: ^18.0.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/streakly_launcher.png
    - assets/icon/streakly_logo.png

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: assets/icon/streakly_launcher.png
    icon_size: 48
  image_path: assets/icon/streakly_launcher.png
  adaptive_icon_background: '#4F46E5'
  adaptive_icon_foreground: assets/icon/streakly_launcher.png
